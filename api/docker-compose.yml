version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pipeline_db
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  broker:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbit_data:/var/lib/rabbitmq

  api:
    build: ./api
    ports:
      - '8000:8000'
    depends_on:
      - db
      - broker
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/pipeline_db
      ORCHESTRATOR_URL: http://api:8000
      INTERNAL_TOKEN: internal-secret-change-me
      MAX_RETRIES: "3"
      WORKER_TIMEOUT_SECONDS: "30"

  refinement-worker:
    build: ./worker
    volumes:
      - ./api:/app
    environment:
      WORKER_NAME: refinement
      ORCHESTRATOR_URL: http://api:8000
      INTERNAL_TOKEN: internal-secret-change-me
    command: sh -c "celery -A celery_app worker --loglevel=info -Q refinement --without-heartbeat false"
    depends_on:
      - broker
      - api

  docking-worker:
    build: ./worker
    volumes:
      - ./api:/app
    environment:
      WORKER_NAME: docking
      ORCHESTRATOR_URL: http://api:8000
      INTERNAL_TOKEN: internal-secret-change-me
    command: sh -c "celery -A celery_app worker --loglevel=info -Q docking --without-heartbeat false"
    depends_on:
      - broker
      - api

  evolution-worker:
    build: ./worker
    volumes:
      - ./api:/app
    environment:
      WORKER_NAME: evolution
      ORCHESTRATOR_URL: http://api:8000
      INTERNAL_TOKEN: internal-secret-change-me
    command: sh -c "celery -A celery_app worker --loglevel=info -Q evolution --without-heartbeat false"
    depends_on:
      - broker
      - api

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - db

volumes:
  db_data: {}
  rabbit_data: {}
```
