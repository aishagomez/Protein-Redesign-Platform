[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "cli"
version = "1.0.0"
description = "CLI para la plataforma de pipelines bioinformáticos"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
bio-cli = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]
